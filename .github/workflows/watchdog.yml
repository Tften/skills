name: Catalog watchdog keepalive

# 兜底机制：GitHub 调度器未为本仓库派发 schedule 事件（配置已全部验证正确），
# 由本 workflow 在 GitHub 托管 runner 上自续链，保证每天北京时间 06:00
# 触发一次 catalog.yml：
#
#   触发后计算距下一个北京时间 06:00（UTC 22:00）的等待时长：
#   - 剩余 > 5h25m：先睡 5h25m，随后派发自身接力（单次运行上限 6 小时）
#   - 剩余 <= 5h25m：一觉睡到 06:00，派发 catalog.yml，再派发自身开始下一天
#
# 注意事项：
# - 任何一次 push 到 dev 或手动 dispatch 都会重启链条并重新对齐到下一个 06:00
# - 同仓库自派发只需 actions: write 权限，无需 PAT
# - runner 会因此常驻挂机（每天约 4~5 段接力运行）
# - schedule 自愈后（运行列表出现 event=schedule）可直接删除本文件

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions: {}

concurrency:
  group: catalog-watchdog
  cancel-in-progress: true

jobs:
  keepalive:
    name: Dispatch catalog daily at 06:00 Beijing
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
    steps:
      - name: Sleep to next 06:00 Beijing, dispatch catalog, re-arm
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MAX_HOP_SECONDS=19500   # 5h25m，为 6 小时单次运行上限留出余量

          dispatch() {
            local workflow="$1" delay="$2" attempt
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" -R "$REPO"; then
                return 0
              fi
              echo "dispatch ${workflow} failed (attempt $attempt), retrying in ${delay}s"
              sleep "$delay"
            done
            return 1
          }

          target=$(date -d "today 22:00" +%s)
          if [ "$target" -le "$(date +%s)" ]; then
            target=$(date -d "tomorrow 22:00" +%s)
          fi
          wait_seconds=$((target - $(date +%s)))
          echo "next trigger: $(date -d "@$target" '+%F %T UTC') = 北京时间 06:00"

          if [ "$wait_seconds" -gt "$MAX_HOP_SECONDS" ]; then
            echo "waiting ${MAX_HOP_SECONDS}s, then handing over to the next hop"
            sleep "$MAX_HOP_SECONDS"
            if ! dispatch watchdog.yml 60; then
              echo "::error::watchdog handover failed; chain broken until next push or manual dispatch"
              exit 1
            fi
            exit 0
          fi

          echo "waiting ${wait_seconds}s until the target time"
          sleep "$wait_seconds"

          if ! dispatch catalog.yml 30; then
            echo "::warning::daily catalog dispatch failed; chain still re-arms"
          fi

          echo "re-arming watchdog for the next day"
          if ! dispatch watchdog.yml 60; then
            echo "::error::watchdog self-dispatch failed after retries; chain broken until next push or manual dispatch"
            exit 1
          fi
